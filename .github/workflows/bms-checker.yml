name: BMS Ticket Checker

on:
  workflow_dispatch:  # Manual trigger button
  push:
    branches:
      - bms-403-diagnostics-20261029

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Diagnose runner public IP and country
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Runner cloud/region are shown in the job's Set up job logs."
          IP="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)" || exit 0
          echo "Runner public egress IP: ${IP}"
          echo "Trying IP country lookup (fallback provider)..."
          if curl --fail --silent --show-error --max-time 10 "https://ipwho.is/${IP}" \
            | jq '{ip, country, country_code, connection: {isp: .connection.isp, org: .connection.org, asn: .connection.asn}}'; then
            exit 0
          fi
          echo "::warning::Country lookup failed or was rate-limited; public IP and runner cloud/region are still available in logs."
          exit 0

      - name: Run checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_TIME: ${{ vars.BMS_TIME }}
          BMS_FORMAT: ${{ vars.BMS_FORMAT }}
          BMS_WATCHES: ${{ vars.BMS_WATCHES }}
          BMS_FAIL_THRESHOLD: ${{ vars.BMS_FAIL_THRESHOLD }}
        run: uv run main.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          git diff --cached --quiet || (git commit -m "chore: update bms_state.json [skip ci]" && git push)
